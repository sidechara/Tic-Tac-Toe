<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Tic Tac Toe Game</title>
    
    <link rel="stylesheet" href="style.css" />
    <script src="main.js"></script>
  </head>
  <body>

    <h1>Tic Tac Toe</h1>

    <div class="info">
      <h2><span class="display_player" id="display-player"></span></h2>
      <script>displayPlayer(0);</script>

      <h2>Score - X: <span id="score_x"></span> | O: <span id="score_o"></span></h2>
      <script>displayScores()</script>
    </div>
    <div class="info">
      <div>
        <input type="checkbox" id="ai" name="ai" value="AI" onclick="setPlayerMode()">
        <label for="ai">Play against AI</label><br>
      </div>
    </div>
    <br>

    <div class="game_board">
      <div class='row'>
        <div class="one" onclick="makeMove('1', 1)"><span class="xo" id="1"></span></div>
        <div class="two" onclick="makeMove('2', 2)"><span class="xo" id="2"></span></div>
        <div class="three" onclick="makeMove('3', 3)"><span class="xo" id="3"></span></div>
      </div>
      <div class='row'>
        <div class="four" onclick="makeMove('4', 4)"><span class="xo" id="4"></span></div>
        <div class="five" onclick="makeMove('5', 5)"><span class="xo" id="5"></span></div>
        <div class="six" onclick="makeMove('6', 6)"><span class="xo" id="6"></span></div>
      </div>
      <div class='row'>
        <div class="seven" onclick="makeMove('7', 7)"><span class="xo" id="7"></span></div>
        <div class="eight" onclick="makeMove('8', 8)"><span class="xo" id="8"></span></div>
        <div class="nine" onclick="makeMove('9', 9)"><span class="xo" id="9"></span></div>
      </div>
    </div>

    <button class="new_game" onclick="newGame()">New Game</button>
    <button class="reset" onclick="reset()">Reset</button>
  </body>


</html>
